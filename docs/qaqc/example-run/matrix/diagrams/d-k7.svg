<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 692 380" role="img" aria-labelledby="d-k7-title d-k7-desc" class="kdiagram-svg" style="width:692px;max-width:none;height:auto;display:block;margin:0 auto"><title id="d-k7-title">工具、AI 與人的分工（江碩濤的說法）</title><desc id="d-k7-desc">確定性的工作給工具，判斷的工作給 AI，最後的決定給人</desc><defs><marker id="d-k7-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8ae99"/></marker></defs><a href="ii.html#p0097" data-anchors="p0097" data-edge="n1-n2"><line x1="346.5" y1="174.0" x2="347.5" y2="104.0" stroke="#b8ae99" stroke-width="1.6" marker-end="url(#d-k7-arr)"/><rect x="296.0" y="127.0" width="102" height="22" rx="4" fill="#f7f1e8"/><text x="347.0" y="143.0" text-anchor="middle" font-size="14" fill="#7a7264">確定性的工作</text></a><a href="ii.html#p0097" data-anchors="p0097" data-edge="n1-n3"><line x1="434.0" y1="241.8" x2="492.0" y2="260.2" stroke="#b8ae99" stroke-width="1.6" marker-end="url(#d-k7-arr)"/><rect x="442.0" y="239.0" width="42" height="22" rx="4" fill="#f7f1e8"/><text x="463.0" y="255.0" text-anchor="middle" font-size="14" fill="#7a7264">判斷</text></a><a href="ii.html#p0097" data-anchors="p0097" data-edge="n1-n4"><line x1="258.0" y1="241.8" x2="200.0" y2="260.2" stroke="#b8ae99" stroke-width="1.6" marker-end="url(#d-k7-arr)"/><rect x="208.0" y="239.0" width="42" height="22" rx="4" fill="#f7f1e8"/><text x="229.0" y="255.0" text-anchor="middle" font-size="14" fill="#7a7264">決定</text></a><a href="ii.html#p0093" data-anchors="p0093" data-node="n1" data-status="existing"><rect x="258.0" y="174.0" width="176" height="80" rx="8" fill="#fffdf9" stroke="#b34a2f" stroke-width="2.2"/><text x="346.0" y="210.0" text-anchor="middle" font-size="15" fill="#2d2a26">一個團隊的分工（講者</text><text x="346.0" y="229.0" text-anchor="middle" font-size="15" fill="#2d2a26">的比喻）</text></a><a href="ii.html#p0093" data-anchors="p0093" data-node="n2" data-status="existing"><rect x="260" y="24" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="348.0" y="60.0" text-anchor="middle" font-size="15" fill="#2d2a26">工具：轉錄、時間軸、</text><text x="348.0" y="79.0" text-anchor="middle" font-size="15" fill="#2d2a26">全形化</text></a><a href="ii.html#p0093" data-anchors="p0093" data-node="n3" data-status="existing"><rect x="492" y="248" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="580.0" y="284.0" text-anchor="middle" font-size="15" fill="#2d2a26">AI：翻譯、標點判斷</text><text x="580.0" y="303.0" text-anchor="middle" font-size="15" fill="#2d2a26">、前後承接</text></a><a href="ii.html#p0093" data-anchors="p0093" data-node="n4" data-status="existing"><rect x="24" y="248" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="112.0" y="284.0" text-anchor="middle" font-size="15" fill="#2d2a26">人：確認專有名詞、最</text><text x="112.0" y="303.0" text-anchor="middle" font-size="15" fill="#2d2a26">後的判斷</text></a><text x="24" y="366" font-size="14" fill="#7a7264" data-anchors="p0093">講者說「如果把它想成一個團隊的分工」。</text></svg>