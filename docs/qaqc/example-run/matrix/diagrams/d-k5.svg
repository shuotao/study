<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 128" role="img" aria-labelledby="d-k5-title d-k5-desc" class="kdiagram-svg" style="width:688px;max-width:none;height:auto;display:block;margin:0 auto"><title id="d-k5-title">四個象限的閱讀順序（江碩濤的說法）</title><desc id="d-k5-desc">扎實完成第二象限的完整閱讀後，再前往一、三象限的強化與深化；當累積量能足以有了知識點間的關係時，第四象限的廣度就會出現</desc><defs><marker id="d-k5-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8ae99"/></marker></defs><a href="ii.html#p0074" data-anchors="p0074" data-edge="n1-n2"><line x1="200.0" y1="64.0" x2="256.0" y2="64.0" stroke="#b8ae99" stroke-width="1.6" marker-end="url(#d-k5-arr)"/><rect x="199.5" y="52.0" width="57" height="22" rx="4" fill="#f7f1e8"/><text x="228.0" y="68.0" text-anchor="middle" font-size="14" fill="#7a7264">再前往</text></a><a href="ii.html#p0074" data-anchors="p0074" data-edge="n2-n3"><line x1="432.0" y1="64.0" x2="488.0" y2="64.0" stroke="#b8ae99" stroke-width="1.6" marker-end="url(#d-k5-arr)"/><rect x="431.5" y="52.0" width="57" height="22" rx="4" fill="#f7f1e8"/><text x="460.0" y="68.0" text-anchor="middle" font-size="14" fill="#7a7264">累積後</text></a><a href="ii.html#p0074" data-anchors="p0074" data-node="n1" data-status="existing"><rect x="24" y="24" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="112.0" y="69.0" text-anchor="middle" font-size="15" fill="#2d2a26">第二象限：完整閱讀</text></a><a href="ii.html#p0074" data-anchors="p0074" data-node="n2" data-status="existing"><rect x="256" y="24" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="344.0" y="60.0" text-anchor="middle" font-size="15" fill="#2d2a26">第一、三象限：強化與</text><text x="344.0" y="79.0" text-anchor="middle" font-size="15" fill="#2d2a26">深化</text></a><a href="ii.html#p0074" data-anchors="p0074" data-node="n3" data-status="existing"><rect x="488" y="24" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="576.0" y="69.0" text-anchor="middle" font-size="15" fill="#2d2a26">第四象限的廣度</text></a></svg>