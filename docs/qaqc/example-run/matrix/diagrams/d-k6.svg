<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 128" role="img" aria-labelledby="d-k6-title d-k6-desc" class="kdiagram-svg" style="width:688px;max-width:none;height:auto;display:block;margin:0 auto"><title id="d-k6-title">第三象限：從一張卡往深處追（江碩濤的說法）</title><desc id="d-k6-desc">專家看到卡片的反應是為什麼，帶回完整的內容，沿著一個問題往下追</desc><defs><marker id="d-k6-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8ae99"/></marker></defs><a href="ii.html#p0060" data-anchors="p0060" data-edge="n1-n2"><line x1="200.0" y1="64.0" x2="256.0" y2="64.0" stroke="#b8ae99" stroke-width="1.6" marker-end="url(#d-k6-arr)"/><rect x="207.0" y="52.0" width="42" height="22" rx="4" fill="#f7f1e8"/><text x="228.0" y="68.0" text-anchor="middle" font-size="14" fill="#7a7264">反應</text></a><a href="ii.html#p0060" data-anchors="p0060" data-edge="n2-n3"><line x1="432.0" y1="64.0" x2="488.0" y2="64.0" stroke="#b8ae99" stroke-width="1.6" marker-end="url(#d-k6-arr)"/><rect x="439.0" y="52.0" width="42" height="22" rx="4" fill="#f7f1e8"/><text x="460.0" y="68.0" text-anchor="middle" font-size="14" fill="#7a7264">帶回</text></a><a href="ii.html#p0060" data-anchors="p0060" data-node="n1" data-status="existing"><rect x="24" y="24" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="112.0" y="69.0" text-anchor="middle" font-size="15" fill="#2d2a26">看到一張卡</text></a><a href="ii.html#p0060" data-anchors="p0060" data-node="n2" data-status="existing"><rect x="256" y="24" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="344.0" y="69.0" text-anchor="middle" font-size="15" fill="#2d2a26">反應是「為什麼」</text></a><a href="ii.html#p0060" data-anchors="p0060" data-node="n3" data-status="existing"><rect x="488" y="24" width="176" height="80" rx="8" fill="#fffdf9" stroke="#2d2a26" stroke-width="1.4"/><text x="576.0" y="60.0" text-anchor="middle" font-size="15" fill="#2d2a26